version: 1
frontend:
  phases:
    preBuild:
      commands:
        - curl -sSL https://github.com/gohugoio/hugo/releases/download/v0.169.0/hugo_extended_0.169.0_linux-amd64.tar.gz | tar -xz hugo
    build:
      commands:
        - ./hugo --gc --minify --baseURL "https://${AWS_BRANCH}.${AWS_APP_ID}.amplifyapp.com/"
  artifacts:
    baseDirectory: public
    files:
      - '**/*'
  cache:
    paths: []